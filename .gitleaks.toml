# Gitleaks config for the Secret Scan CI job (.github/workflows/secret-scan.yml),
# which runs `gitleaks git .` — GIT MODE, so it scans the whole commit history,
# not just the working tree (build artifacts like unraid-rs/target/ are never seen).
#
# ACCEPTED-RISK TRADEOFF (reviewed): the files listed below hold realistic-looking
# PLACEHOLDER credentials — docs examples, generated openwiki, and test
# fixtures/test code that exercise request construction with fake keys. gitleaks
# cannot distinguish a fake fixture key from a real one by content, so without an
# allowlist these produce false positives and fail CI. Do NOT commit real secrets
# under them.
#
# WHY EXPLICIT FILES, NOT DIRECTORY GLOBS:
# This list used to be four directory globs — (^|/)docs/, (^|/)openwiki/,
# (^|/)tests/, (^|/)skills/ — written when this repo contained only the Python
# server. After the monorepo consolidation those same globs also silently blinded
# unraid-rs/docs/, unraid-rs/tests/, plugins/codex/tests/, agents/*/skills/, and
# ~149 files of vendored third-party documentation under plugins/incus/docs/:
# roughly 200 files with no relationship to test fixtures. A real credential
# committed under any of them would never have been caught.
#
# The entries below were generated by running gitleaks with NO allowlist and
# keeping exactly the files that actually trip it (50 findings across 11 files).
# Adding a new fixture with a fake credential now requires an explicit entry —
# which is the point.
#
# NOTE ON PATH SHAPE: each pattern is anchored with (^|/) rather than to the repo
# root, because git-mode scans HISTORY and these files lived at the repo root
# before the consolidation moved them under unraid-py/ etc. The (^|/) prefix
# matches both the historical and the current path for the same file. Do not
# "tidy" these into unraid-py/... absolute forms — that breaks the history scan.
#
# Re-generate after adding a fixture:
#   printf '[extend]\nuseDefault = true\n' > /tmp/gl.toml
#   gitleaks git . --config /tmp/gl.toml --report-format json --report-path /tmp/leaks.json --exit-code 0
#   jq -r '.[].File' /tmp/leaks.json | sort -u
#
# NOTE: the previous per-crate unraid-rs/.gitleaks.toml was dead (never loaded by
# the root-run CI) and has been removed.

[extend]
useDefault = true

[allowlist]
description = "Specific docs, generated wiki, and test files that contain placeholder credentials only"
paths = [
  # Frozen vendored copy of lab-auth. Its #[cfg(test)] module carries a
  # TEST_RSA_KEY_PEM keypair used only to sign JWTs in unit tests
  # (test_rsa_key/test_encoding_key). Ships to crates.io with the crate, as it
  # does upstream. No path predates the vendoring, so this matches the one file.
  '''(^|/)crates/lab\-auth/src/authorize\.rs$''',
  '''(^|/)docs/AUTHENTICATION\.md$''',
  '''(^|/)docs/UNRAID_API_REFERENCE\.md$''',
  '''(^|/)docs/unraid/unraid\-os/system\-administration/advanced\-tools/command\-line\-interface\.md$''',
  '''(^|/)openwiki/operations/configuration\.md$''',
  '''(^|/)skills/unraid/references/api\-reference\.md$''',
  '''(^|/)tests/fixtures/scenarios/healthy\.json$''',
  '''(^|/)tests/http/test_request_construction\.py$''',
  '''(^|/)tests/mcporter/test\-http\.sh$''',
  '''(^|/)tests/test_api_key_auth\.py$''',
  '''(^|/)tests/test_live\.sh$''',
  '''(^|/)tests/test_settings\.py$''',
]
