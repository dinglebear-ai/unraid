name: incus-release

# Triggered when release-please publishes an incus-v<version> release. Rebuilds
# the classic .txz (carrying forward the previous release's binary payload, since
# .txz are no longer tracked in git) and attaches it + the .plg to the release.
#
# NOTE (verified post-merge): build-classic-package.sh REQUIRES a previous .txz to
# carry the binary payload forward. The FIRST incus-v release has no predecessor —
# seed it once from the legacy incus-unraid release asset (build 55), then this
# workflow is self-sustaining.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: incus-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'incus-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/incus
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build + validation tooling
        run: sudo apt-get update && sudo apt-get install -y jq xz-utils libxml2-utils shellcheck

      - name: Derive build number and fetch previous payload
        run: |
          set -euo pipefail
          txz="$(sed -n 's/.*<!ENTITY txz[[:space:]]*"\([^"]*\)".*/\1/p' incus.plg)"
          txz="${txz//&name;/incus}"
          build="$(printf '%s\n' "$txz" | sed -n 's/incus-unraid-7\.0\.0-\([0-9]*\)-x86_64-1\.txz/\1/p')"
          [ -n "$build" ] || { echo "::error::could not parse build number from incus.plg &txz; entity"; exit 1; }
          echo "BUILD=${build}" >> "$GITHUB_ENV"
          mkdir -p prev
          # --limit is REQUIRED: `gh release list` defaults to 30, and in this
          # monorepo unraid-py/unraid-rs/codex releases interleave with incus ones.
          # Without it, once 30 newer releases exist the incus predecessor falls off
          # the page and this reports "no previous release" — sending whoever debugs
          # it toward seeding a first release that already exists.
          incus_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName \
            --jq '[.[].tagName | select(startswith("incus-v"))]' 2>/dev/null || echo '[]')"
          incus_count="$(printf '%s' "$incus_tags" | jq 'length')"
          prev_tag="$(printf '%s' "$incus_tags" | jq -r '.[1] // empty')"
          echo "PREV_TAG=${prev_tag}" >> "$GITHUB_ENV"
          echo "INCUS_RELEASE_COUNT=${incus_count}" >> "$GITHUB_ENV"
          if [ -n "$prev_tag" ]; then
            gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" -p '*.txz' -D prev \
              || { echo "::error::failed to download the previous payload from $prev_tag (transient? asset renamed?) — re-run this job"; exit 1; }
          fi

      - name: Build classic package
        run: |
          set -euo pipefail
          prevtxz="$(ls prev/*.txz 2>/dev/null | head -1 || true)"
          if [ -z "$prevtxz" ]; then
            if [ -n "${PREV_TAG:-}" ]; then
              echo "::error::previous release ${PREV_TAG} exists but shipped no .txz asset — investigate before re-running"
            elif [ "${INCUS_RELEASE_COUNT:-0}" -le 1 ]; then
              # Genuinely the first incus release out of the monorepo. The .plg's
              # &txzURL; points at this release's own tag, so publishing without a
              # payload ships a plugin whose download 404s.
              echo "::error::this is the first incus-v release ($INCUS_RELEASE_COUNT found) and there is no predecessor to carry the payload forward from."
              echo "::error::Seed it once, then re-run: create release incus-v<version> and upload the legacy incus-unraid-7.0.0-55-x86_64-1.txz asset to it."
            else
              echo "::error::found $INCUS_RELEASE_COUNT incus-v releases but could not resolve a predecessor payload — check the release listing window and asset names"
            fi
            exit 1
          fi
          ./scripts/build-classic-package.sh "$BUILD" "$prevtxz"

      - name: Verify the rebuilt package
        run: ./scripts/verify-classic-package.sh

      - name: Attach package + manifest to the release
        run: |
          gh release upload "$TAG" \
            "packages/incus-unraid-7.0.0-${BUILD}-x86_64-1.txz" \
            incus.plg --clobber
