name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  contract:
    runs-on: ci-pool-ops
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Check out pinned fleet validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dinglebear-ai/workflows
          ref: d1a41a7af9c41189e0f1062234364f5814bda99d
          path: workflow-library
          persist-credentials: false
      - name: Validate fleet and AGENTS-canonical repository contracts
        # Keep the pinned fleet rules. Only its obsolete CLAUDE-canonical rule
        # is replaced by the stricter local working-tree and index check.
        run: >-
          python3 target/.github/scripts/check_repository_contract.py
          --repo target
          --fleet-script workflow-library/scripts/fleet_contract.py
          --profile rust

  repository-contract:
    name: Repository Contract
    if: always()
    needs: [contract]
    runs-on: ci-pool-ops
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require repository contract
        env:
          RESULT: ${{ needs.contract.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "repository contract concluded $RESULT" >&2
            exit 1
          fi
