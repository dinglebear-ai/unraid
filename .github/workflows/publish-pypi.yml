name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to reconcile (for example, v2.3.6)
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: python-dist-${{ github.run_id }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    name: Build & Attest Release Artifact
    # Only the primary (Python) release tag `v*`. Component tags start with
    # incus-/codex-/unraid-rs-, so startsWith(tag,'v') already excludes them.
    # Gating build cascades to pypi/github-release/reconcile via needs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Python package sources live in unraid-py/; build run: steps execute there.
    defaults:
      run:
        working-directory: unraid-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.25"
          enable-cache: false
      - name: Verify tag matches package version
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          test "$package_version" = "${RELEASE_TAG#v}"
      - name: Stamp canonical MCP package ownership proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          lines = readme.read_text(encoding="utf-8").splitlines()
          marker = "<!-- mcp-name: ai.dinglebear/unraid-mcp -->"
          replaced = False
          for index, line in enumerate(lines):
              if line.startswith("<!-- mcp-name:"):
                  lines[index] = marker
                  replaced = True
                  break
          if not replaced:
              lines.insert(1, "")
              lines.insert(2, marker)
          readme.write_text("\n".join(lines) + "\n", encoding="utf-8")
          assert marker in readme.read_text(encoding="utf-8")
          PY
      - name: Build package once from clean sources
        run: uv build --no-sources
      - name: Validate metadata, wheel contents, and installed stdio server
        run: |
          uv tool run --from twine==6.2.0 twine check dist/*
          unzip -l dist/*.whl | tee wheel-contents.txt
          grep -q 'unraid_mcp/server.py' wheel-contents.txt
          grep -q 'licenses/LICENSE' wheel-contents.txt
          unzip -p dist/*.whl '*.dist-info/METADATA' |
            grep -F 'mcp-name: ai.dinglebear/unraid-mcp'
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          bash scripts/smoke-stdio.sh .release-venv/bin/unraid-mcp-server
      - name: Generate consumer-verifiable checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Upload immutable internal release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: unraid-py/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest exact wheel and source distribution
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            unraid-py/dist/*.whl
            unraid-py/dist/*.tar.gz
            unraid-py/dist/SHA256SUMS

  pypi:
    name: Publish PyPI Channel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
      - name: Reconcile existing PyPI state
        id: state
        run: |
          version="${RELEASE_TAG#v}"
          if curl -fsS "https://pypi.org/pypi/unraid-mcp/${version}/json" > pypi-existing.json; then
            published=true
            while read -r checksum filename; do
              remote_checksum="$(
                jq -r --arg filename "$filename" \
                  '[.urls[] | select(.filename == $filename) | .digests.sha256][0] // empty' \
                  pypi-existing.json
              )"
              if [ -z "$remote_checksum" ]; then
                published=false
              elif [ "$remote_checksum" != "$checksum" ]; then
                echo "::error::PyPI already contains $filename with a different checksum"
                exit 1
              fi
            done < dist/SHA256SUMS
            echo "published=$published" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove non-distribution checksum manifest from upload directory
        if: steps.state.outputs.published != 'true'
        run: rm dist/SHA256SUMS
      - name: Publish exact artifact to PyPI idempotently
        if: steps.state.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true

  github-release:
    name: Publish GitHub Release Channel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
      - name: Attach exact artifacts and checksums idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  reconcile:
    name: Release Reconciliation
    needs: [build, pypi, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
      - name: Verify checksums and PyPI digests
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          curl -fsS "https://pypi.org/pypi/unraid-mcp/${version}/json" > pypi.json
          while read -r checksum filename; do
            jq -e --arg filename "$filename" --arg checksum "$checksum" \
              '.urls[] | select(.filename == $filename and .digests.sha256 == $checksum)' pypi.json >/dev/null
          done < dist/SHA256SUMS
      - name: Verify GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir github-assets
          gh release download "$RELEASE_TAG" --dir github-assets --pattern 'unraid_mcp-*' --pattern SHA256SUMS
          (cd github-assets && sha256sum --check SHA256SUMS)
          diff -rq dist github-assets
      - name: Wait for matching GHCR release and latest digests
        env:
          # Pinned, not derived from github.repository: the repo was renamed
          # unraid-mcp -> unraid and GHCR paths do not follow rename redirects.
          GHCR_IMAGE: ${{ github.repository_owner }}/unraid-mcp
        run: |
          version="${RELEASE_TAG#v}"
          for _ in {1..30}; do
            version_digest="$(docker buildx imagetools inspect "ghcr.io/${GHCR_IMAGE}:${version}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            latest_digest="$(docker buildx imagetools inspect "ghcr.io/${GHCR_IMAGE}:latest" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            if [[ -n "$version_digest" && "$version_digest" = "$latest_digest" ]]; then
              echo "GHCR ${version} and latest reconcile to ${version_digest}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::GHCR version and latest tags did not reconcile"
          exit 1
