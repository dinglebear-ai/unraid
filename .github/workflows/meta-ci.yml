name: meta-ci

# Every per-component workflow is paths:-scoped to its own subtree, so a PR that
# touches ONLY shared root files (release-please config/manifest, either
# marketplace, ignore/attribute/secret-scan config, or a workflow) would otherwise
# match no filter and run zero jobs — merging green even if it breaks the release
# config. This job is scoped to exactly those files so it always runs when they
# change. Make it a required status check on main.
#
# KEEP THIS FILTER EXHAUSTIVE: any shared root file not listed here, and not
# covered by a component filter, has NO gate at all. That is how
# .agents/plugins/marketplace.json went entirely unvalidated after the
# consolidation — it was neither in this filter nor checked by the script below.
on:
  push:
    paths: &meta_paths
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".claude-plugin/**"
      - ".agents/**"
      - "agents/**"
      - ".github/**"
      - ".gitattributes"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".mise.toml"
      - "lefthook.yml"
      - "CLAUDE.md"
      - "README.md"
      - "ca_profile.xml"
  pull_request:
    paths: *meta_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full tag history — check-plg-version-ordering.sh compares against
          # every existing incus-v*/codex-v* tag.
          fetch-depth: 0
      - name: Install validation tools
        run: |
          python3 -m pip install --quiet pyyaml
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate all Community Applications metadata
        run: |
          plugins/incus/tests/ca-metadata.sh
          plugins/mcp/tests/ca-metadata.sh
          plugins/codex/tests/ca-metadata.sh

      - name: Validate release manager, versions, and tag contract
        run: python3 ./.github/scripts/release_contract.py

      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Unraid .plg versions must not regress under string comparison
        run: ./.github/scripts/check-plg-version-ordering.sh

      - name: Validate JSON configs + marketplace sources + all workflow YAML
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['release-please-config.json','.release-please-manifest.json','.claude-plugin/marketplace.json','.agents/plugins/marketplace.json']]"
          python3 -c "import json,os;d=json.load(open('.claude-plugin/marketplace.json'));assert all(os.path.isdir(p['source'].lstrip('./')) for p in d['plugins']),'bad marketplace source path'"
          # The Codex marketplace uses a different schema (source is an object with
          # a `path`) and its source paths break the same way on a component move.
          python3 -c "import json,os;d=json.load(open('.agents/plugins/marketplace.json'));assert all(os.path.isdir(p['source']['path'].lstrip('./')) for p in d['plugins']),'bad .agents marketplace source path'"
          python3 -c "import glob,yaml;[yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')+glob.glob('.github/workflows/*.yaml')]"
          python3 -c "import yaml;yaml.safe_load(open('.github/dependabot.yml'))"
          # agents/*/plugin.json are release-please version-bump targets — a malformed one would fail at release time; catch it here
          python3 -c "import glob,json;[json.load(open(f)) for f in glob.glob('agents/*/.claude-plugin/plugin.json')+glob.glob('agents/*/.codex-plugin/plugin.json')]"

      - name: Release Please must preserve component identity
        run: |
          python3 - <<'PY'
          import json

          config = json.load(open("release-please-config.json"))
          assert config.get("separate-pull-requests") is True
          packages = config["packages"]
          assert packages["unraid-py"]["component"] == "unraid-mcp"
          assert packages["unraid-py"]["include-component-in-tag"] is False
          assert packages["unraid-rs"]["component"] == "unraid-rs"
          print("release-please component identities are explicit and separate")
          PY

      - name: Both marketplaces must expose the same plugin set
        run: |
          python3 - <<'PY'
          import json
          claude = {p["name"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]}
          codex = {p["name"] for p in json.load(open(".agents/plugins/marketplace.json"))["plugins"]}
          assert claude == codex, f"marketplace drift: claude-only={sorted(claude - codex)}, codex-only={sorted(codex - claude)}"
          print(f"both marketplaces expose: {sorted(claude)}")
          PY

      # A dependabot `directory:` that matches nothing produces no PRs and no
      # error — a stale path silently kills an update stream (this happened to the
      # docker and uv streams when the Python server moved into unraid-py/).
      - name: Dependabot directories must exist
        run: |
          python3 - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open(".github/dependabot.yml"))
          missing = [u["directory"] for u in cfg["updates"] if not os.path.isdir("." + u["directory"])]
          assert not missing, f"dependabot directory matches nothing (silently disables updates): {missing}"
          print(f"all {len(cfg['updates'])} dependabot directories exist")
          PY

      # A CODEOWNERS pattern matching nothing is inert: no required reviewer, no
      # error. Five rules were dead after the consolidation.
      - name: CODEOWNERS patterns must match tracked files
        run: |
          python3 - <<'PY'
          import subprocess
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          dead = []
          for line in open(".github/CODEOWNERS"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              stem = line.split()[0].lstrip("/").rstrip("/")
              if not any(f == stem or f.startswith(stem + "/") for f in tracked):
                  dead.append(stem)
          assert not dead, f"CODEOWNERS rule matches nothing (silently drops required review): {dead}"
          print("all CODEOWNERS patterns match tracked files")
          PY

      # The SHA is the real pin, but the trailing comment is what humans read when
      # auditing or bumping. Extracted to a script because the policy test in
      # unraid-py/tests/ scans workflow YAML line-by-line for action references,
      # and an inline regex describing that syntax trips it as a false positive.
      - name: Pinned action SHAs must carry a consistent version comment
        run: python3 ./.github/scripts/check-action-pin-comments.py

      # This repo uses `allowed_actions: selected`. A non-allowlisted action is
      # rejected at COMPILE time — no jobs, no logs, and NO check-run, so it shows
      # as an absent check that branch protection cannot see. rust-ci was broken
      # and invisible that way from 2026-07-24. Checks against the checked-in
      # mirror, because GITHUB_TOKEN cannot read the live setting.
      - name: Every action must be on the repo allowlist
        run: python3 ./.github/scripts/check-actions-allowlist.py

      # .github/actionlint.yaml already existed but nothing ran it. Installed as a
      # checksum-verified release download rather than a third-party action.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
