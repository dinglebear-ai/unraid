name: mcp-ci

# PR-time gate for the plugins/mcp Unraid plugin.
#
# WHY: before this existed, nothing under plugins/mcp/** matched ANY workflow's
# paths filter. build-txz.sh and unraid-mcp.plg were first executed by
# build-unraid-plugin.yml, which only runs on `release: published` — i.e. AFTER
# the v* tag was cut, concurrently with the PyPI publish. A break in the packaging
# script was discovered mid-release instead of on the PR.
on:
  push:
    paths:
      - "plugins/mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "plugins/mcp/**"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/mcp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install static validators
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils shellcheck

      # These run as root on Unraid (Slackware). A syntax error ships to users.
      - name: Shellcheck packaging and on-box scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            find scripts source -type f \( -name '*.sh' -o -name 'rc.*' -o -path '*/event/*' \) | sort
          )
          printf 'checking %d scripts\n' "${#scripts[@]}"
          printf '%s\n' "${scripts[@]}"
          shellcheck -S warning "${scripts[@]}"

      - name: Shell scripts must be executable and LF-terminated
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            [ -x "$f" ] || { echo "not executable: $f"; status=1; }
            if grep -qU $'\r' "$f"; then echo "CRLF line endings: $f"; status=1; fi
          done < <(find source -type f \( -name '*.sh' -o -name 'rc.*' -o -path '*/event/*' \))
          exit "$status"

      # Unraid parses the .plg as XML; a malformed entity block bricks the install.
      - name: Validate .plg XML and required entities
        run: |
          set -euo pipefail
          xmllint --noout unraid-mcp.plg
          for entity in name version md5 sha256; do
            grep -qE "<!ENTITY[[:space:]]+${entity}[[:space:]]" unraid-mcp.plg \
              || { echo "::error::unraid-mcp.plg is missing the &${entity}; entity"; exit 1; }
          done
          # The version/checksum entities are substituted by build-txz.sh at package
          # time; the tracked file must still carry the placeholders, not a stale
          # real value that would ship a mismatched payload.
          for placeholder in VERSION_PLACEHOLDER MD5_PLACEHOLDER SHA256_PLACEHOLDER; do
            grep -q "$placeholder" unraid-mcp.plg \
              || { echo "::error::unraid-mcp.plg lost its ${placeholder} — build-txz.sh substitutes these at package time"; exit 1; }
          done

      - name: Build the web bundle
        run: npm ci --no-audit --no-fund --prefix web && npm run build --prefix web

      # Catches a stale pinned interpreter hash before release day.
      - name: Pinned CPython hash must match upstream SHA256SUMS
        run: |
          set -euo pipefail
          eval "$(grep -E '^(PYTHON_VERSION|PBS_RELEASE|PBS_SHA256)=' scripts/build-txz.sh)"
          tarball="cpython-${PYTHON_VERSION}+${PBS_RELEASE}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          expected="$(curl -fsSL "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/SHA256SUMS" | awk -v t="$tarball" '$2 == t {print $1}')"
          [ -n "$expected" ] || { echo "::error::${tarball} not listed in upstream SHA256SUMS for release ${PBS_RELEASE}"; exit 1; }
          if [ "$expected" != "$PBS_SHA256" ]; then
            echo "::error::PBS_SHA256 in build-txz.sh (${PBS_SHA256}) does not match upstream (${expected})"
            exit 1
          fi
          echo "pinned CPython hash matches upstream SHA256SUMS"
