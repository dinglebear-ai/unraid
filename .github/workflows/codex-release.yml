name: codex-release

# A codex-v<version> release is publishable only when the tagged manifest,
# browser bundle, deterministic package, and both checksums agree.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: codex-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'codex-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/codex
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/codex/web-src/package-lock.json
      - name: Install validators and packaging tools
        run: sudo apt-get update && sudo apt-get install -y file libxml2-utils shellcheck xz-utils
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund --prefix web-src
      # Same browser cache as codex-ci.yml: keyed on the locked playwright version
      # + runner OS so a release run reuses the ~150MB Chromium download.
      - name: Resolve locked Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(node -p "require('./web-src/package-lock.json').packages['node_modules/playwright'].version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::could not resolve playwright version from web-src/package-lock.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for the chathead smoke test
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cd web-src
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify release payload
        run: ./scripts/verify-release.sh
      - name: Run browser smoke
        run: node tests/webwright-chathead/browser-smoke.cjs
      - name: Resolve release asset names
        run: |
          set -euo pipefail
          version="${TAG#codex-v}"
          build="$(sed -n 's/.*<!ENTITY txz[[:space:]]*"unraid-codex-[^"]*-x86_64-\([0-9]*\)\.txz".*/\1/p' unraid-codex.plg)"
          [ -n "$build" ] || { echo "::error::could not parse build number from manifest"; exit 1; }
          package="dist/unraid-codex-${version}-x86_64-${build}.txz"
          {
            echo "VERSION=$version"
            echo "BUILD=$build"
            echo "PACKAGE=$package"
          } >> "$GITHUB_ENV"
          {
            md5sum "$package"
            sha256sum "$package"
          } > "dist/unraid-codex-${version}-checksums.txt"
      - name: Attach verified assets to the release
        run: |
          gh release upload "$TAG" \
            "$PACKAGE" \
            "dist/unraid-codex-${VERSION}-checksums.txt" \
            unraid-codex.plg --clobber

      - name: Restore the primary Unraid MCP release as Latest
        run: python3 ../../.github/scripts/ensure_primary_latest.py "$TAG"
