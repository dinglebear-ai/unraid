name: rust-release

# Triggered when release-please publishes an unraid-rs-v<version> release. Builds
# the linux/amd64 runraid binary, packages the native Unraid plugin, publishes
# the @dinglebear/unraid npm launcher, and builds+pushes the Rust server image (folds in runraid's former
# standalone docker-publish workflow). All run: steps execute in unraid-rs/.
#
# NOTE (verified post-merge): the windows cross-build and trivy scan from the
# standalone runraid release pipeline are intentionally omitted here for the
# consolidated repo; re-add if a windows artifact is required.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unraid-rs-vX.Y.Z release tag to publish
        required: true
        type: string
      source_ref:
        description: Source ref containing corrected release metadata
        required: true
        default: main
        type: string
      publish_npm:
        description: Publish the npm launcher (requires configured npm trusted publishing)
        required: true
        default: false
        type: boolean
      publish_docker:
        description: Publish the Rust container image
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Distinct from the Python server image (ghcr.io/<owner>/unraid-mcp) to avoid
  # a tag collision and owned by this monorepo rather than the legacy runraid repo.
  RUST_IMAGE: ghcr.io/${{ github.repository_owner }}/unraid-rmcp

defaults:
  run:
    working-directory: unraid-rs

jobs:
  build:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'unraid-rs-v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'unraid-rs-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: unraid-rs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install plugin package validators
        run: sudo apt-get update && sudo apt-get install -y file libxml2-utils xz-utils

      - name: Build linux/amd64 binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin runraid

      - name: Stage artifact + checksum
        run: |
          set -euo pipefail
          cp "target/x86_64-unknown-linux-gnu/release/runraid" runraid-linux-x86_64
          sha256sum runraid-linux-x86_64 > runraid-linux-x86_64.sha256
          tar -czf runraid-x86_64.tar.gz runraid-linux-x86_64
          sha256sum runraid-x86_64.tar.gz > runraid-x86_64.tar.gz.sha256

      - name: Build and verify native Unraid plugin
        run: |
          set -euo pipefail
          version="${TAG#unraid-rs-v}"
          bash ../plugins/mcp/scripts/build-txz.sh \
            "$version" \
            "$PWD/target/x86_64-unknown-linux-gnu/release/runraid"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: unraid-rs/runraid-linux-x86_64

      - name: Attach binary + checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            runraid-linux-x86_64 runraid-linux-x86_64.sha256 \
            runraid-x86_64.tar.gz runraid-x86_64.tar.gz.sha256 \
            "../plugins/mcp/packages/unraid-mcp-${TAG#unraid-rs-v}-x86_64-2.txz" \
            ../plugins/mcp/packages/unraid-mcp.plg --clobber
          if [ "${{ github.event_name }}" = "release" ]; then
            release_id="${{ github.event.release.id }}"
          else
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f make_latest=false >/dev/null

      - name: Publish rolling Community Applications manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rolling=unraid-plugin-latest
          if ! gh release view "$rolling" >/dev/null 2>&1; then
            gh release create "$rolling" \
              --target "$(git rev-parse HEAD)" \
              --title "Unraid MCP Plugin" \
              --notes "Rolling manifest consumed by Unraid Community Applications." \
              --prerelease
          fi
          gh release upload "$rolling" ../plugins/mcp/packages/unraid-mcp.plg --clobber

  npm:
    needs: build
    if: >-
      always() &&
      (
        (github.event_name == 'release' && needs.build.result == 'success' &&
          vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' &&
          startsWith(github.event.release.tag_name, 'unraid-rs-v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_npm &&
          startsWith(inputs.tag, 'unraid-rs-v'))
      )
    # npm trusted publishing supports GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1

      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null

      - name: Verify npm package version matches release tag
        id: npm-version
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/unraid-rmcp/package.json').version")"
          if [[ "$TAG" != "unraid-rs-v${version}" ]]; then
            echo "::error::release tag ${TAG} does not match packages/unraid-rmcp/package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test npm launcher
        run: npm test --prefix packages/unraid-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/unraid-rmcp

      - name: Publish npm package if not already present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.npm-version.outputs.version }}"
          if npm view "@dinglebear/unraid@${version}" version >/dev/null 2>&1; then
            echo "@dinglebear/unraid@${version} already published; skipping."
          else
            npm publish --provenance --access public ./packages/unraid-rmcp
          fi

  docker:
    needs: build
    if: >-
      always() &&
      (
        (github.event_name == 'release' && needs.build.result == 'success' &&
          startsWith(github.event.release.tag_name, 'unraid-rs-v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_docker &&
          startsWith(inputs.tag, 'unraid-rs-v'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: tags
        run: echo "version=${TAG#unraid-rs-v}" >> "$GITHUB_OUTPUT"
      - name: Build and push the Rust server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./unraid-rs
          file: ./unraid-rs/config/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.RUST_IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.RUST_IMAGE }}:latest
