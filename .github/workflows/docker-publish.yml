name: Container Artifact

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Pinned, not derived from github.repository: the repo was renamed unraid-mcp -> unraid
  # and GHCR package paths do not follow repo-rename redirects.
  IMAGE_NAME: ${{ github.repository_owner }}/unraid-mcp
  RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/unraid-mcp:${{ github.event.release.tag_name }}

jobs:
  container:
    name: Build, scan, attest, and publish
    if: startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0 # fleet-2026-07-30
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      image: ghcr.io/${{ github.repository_owner }}/unraid-mcp
      release-tag: ${{ github.event.release.tag_name }}
      context: ./unraid-py
      dockerfile: unraid-py/Dockerfile
      smoke-command: docker run --rm "$IMAGE_REF" --version
      cache-scope: unraid-python-release
      timeout-minutes: 35
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-smoke:
    name: Smoke published HTTP, readiness, and MCP
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: unraid-py
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package version and hardened runtime
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          test "$package_version" = "${GITHUB_REF_NAME#v}"
          docker run --rm --entrypoint sh "$RELEASE_IMAGE" -c '
            ! command -v pip &&
            ! command -v pip3 &&
            python -c "import importlib.util; assert importlib.util.find_spec(\"pip\") is None; assert importlib.util.find_spec(\"setuptools\") is None; assert importlib.util.find_spec(\"wheel\") is None"
          '
      - name: Start deterministic readiness mock upstream
        run: |
          python3 scripts/readiness_mock.py 9002 >mock.log 2>&1 &
          echo $! > mock.pid
          for _ in {1..20}; do
            curl -fsS http://127.0.0.1:9002/health >/dev/null && exit 0
            sleep 1
          done
          cat mock.log
          exit 1
      - name: Exercise the published image
        env:
          TOKEN: ci-artifact-token
        run: |
          docker run --detach --name unraid-mcp-artifact --network host \
            --env UNRAID_API_URL=http://127.0.0.1:9002/graphql \
            --env UNRAID_API_KEY=ci-fake-key \
            --env UNRAID_MCP_BEARER_TOKEN="$TOKEN" \
            "$RELEASE_IMAGE"
          trap 'docker logs unraid-mcp-artifact || true; docker rm -f unraid-mcp-artifact || true; kill "$(cat mock.pid)" || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:6970/health >/dev/null && \
               curl -fsS http://127.0.0.1:6970/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6970/health | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:6970/ready | jq -e '.status == "ready"'
          bash tests/test_live.sh --mode http \
            --url http://127.0.0.1:6970/mcp \
            --token "$TOKEN" --skip-tools

  promote-tags:
    name: Promote verified release aliases
    needs: mcp-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified digest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          }
          minor="${version%.*}"
          major="${version%%.*}"
          image="${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          short_sha="${GITHUB_SHA:0:7}"
          for tag in "$version" "$minor" "$major" latest "sha-${short_sha}"; do
            docker buildx imagetools create --tag "${image}:${tag}" "${image}@${digest}"
          done
