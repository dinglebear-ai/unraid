name: codex-ci

on:
  push:
    paths:
      - "plugins/codex/**"
      - ".github/workflows/codex-ci.yml"
  pull_request:
    paths:
      - "plugins/codex/**"
      - ".github/workflows/codex-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/codex
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install static validators
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils shellcheck file
      - name: Run codex plugin contract tests
        run: ./tests/contract.sh

      # The built web bundle is COMMITTED and shipped verbatim by
      # scripts/build-package.sh (it copies source/ and never runs a build). Nothing
      # verified the bundle still corresponded to web-src/ — contract.sh only greps
      # the SOURCE for strings and asserts the bundle file exists, so editing a .tsx
      # without rebuilding shipped a stale 500 KB bundle with CI green.
      # vite writes straight into source/.../web/, and the build is deterministic,
      # so a rebuild-and-diff is an exact check.
      - name: Typecheck web sources
        run: npm ci --no-audit --no-fund --prefix web-src && npm run typecheck --prefix web-src
      - name: Committed web bundle must match a fresh build of web-src
        run: |
          set -euo pipefail
          npm run build --prefix web-src
          if ! git diff --quiet -- source/usr/local/emhttp/plugins/unraid-codex/web/; then
            echo "::error::The committed web bundle is stale — rebuild it and commit the result:"
            echo "::error::  cd plugins/codex/web-src && npm ci && npm run build"
            git --no-pager diff --stat -- source/usr/local/emhttp/plugins/unraid-codex/web/
            exit 1
          fi
          echo "committed bundle matches a fresh build of web-src"
