name: Schema drift

# Daily check: has Unraid's published GraphQL SDL drifted from either vendored
# copy? Both servers pin the schema independently — the Python SDL at
# unraid-py/docs/unraid/UNRAID-SCHEMA.graphql and the Rust SDL at
# unraid-rs/schema/unraid-schema.graphql (which carries a provenance header that
# has to be stripped before diffing). This used to be two workflows on the SAME
# 06:00 UTC cron fetching the SAME upstream blob; rust-schema-drift.yml was merged
# in here so `unraid/api@main` is resolved and downloaded exactly once. The two
# sides keep separate issue labels (schema-drift / schema-drift-rust) and separate
# reporting, because re-vendoring them is separate work.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: schema-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare vendored Unraid SDLs to upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    # The vendored Python SDL (docs/unraid/UNRAID-SCHEMA.graphql) and the
    # schema_diff_summary devtool live under unraid-py/; run: steps execute there
    # by default. The Rust steps below override working-directory to unraid-rs.
    defaults:
      run:
        working-directory: unraid-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve `main` to an immutable commit first. Fetching the mutable ref
      # directly makes this job's result depend on when it ran rather than on repo
      # state — two runs of the same commit could disagree, and a reported diff
      # could not be reproduced. Both the Python and Rust comparisons below read
      # this one downloaded blob.
      - name: Resolve and fetch immutable upstream SDL
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_commit="$(gh api repos/unraid/api/commits/main --jq .sha)"
          if ! [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid upstream commit: $upstream_commit"
            exit 1
          fi
          curl -fsSL \
            "https://raw.githubusercontent.com/unraid/api/${upstream_commit}/api/generated-schema.graphql" \
            -o upstream-schema.graphql
          echo "commit=${upstream_commit}" >> "$GITHUB_OUTPUT"
          echo "Resolved unraid/api@main to immutable commit ${upstream_commit}."

      - name: Diff vendored Python schema
        id: diff
        run: |
          if diff -u docs/unraid/UNRAID-SCHEMA.graphql upstream-schema.graphql > schema.diff; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Vendored Unraid SDL is up to date."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Unraid SDL has drifted from the vendored copy:"
            cat schema.diff
          fi

      - name: Set up uv
        if: steps.diff.outputs.drift == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.25"
          enable-cache: false

      - name: Summarize structured schema changes
        if: steps.diff.outputs.drift == 'true'
        run: |
          uv run python -m unraid_mcp.devtools.schema_diff_summary \
            docs/unraid/UNRAID-SCHEMA.graphql \
            upstream-schema.graphql \
            > schema-summary.md

      - name: Upload full schema drift artifacts
        if: steps.diff.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: unraid-schema-drift-${{ github.run_id }}
          path: |
            unraid-py/schema.diff
            unraid-py/schema-summary.md
            unraid-py/upstream-schema.graphql
          retention-days: 14

      - name: Open or update drift issue
        id: issue
        if: steps.diff.outputs.drift == 'true'
        run: |
          title="Unraid GraphQL schema drift detected"
          label="schema-drift"
          schema_hash="$(sha256sum upstream-schema.graphql | awk '{print $1}')"
          gh label create "$label" \
            --color "d73a4a" \
            --description "Automated upstream Unraid GraphQL schema drift reports" \
            >/dev/null 2>&1 || true

          {
            echo "<!-- upstream-schema-sha256: ${schema_hash} -->"
            echo
            echo "The vendored \`docs/unraid/UNRAID-SCHEMA.graphql\` no longer matches"
            echo "Unraid's published SDL at \`unraid/api@main\`."
            echo "The compared blob was fetched from immutable commit"
            echo "\`${{ steps.upstream.outputs.commit }}\`."
            echo
            echo "Re-vendor the schema, then run the schema and dispatch contract tests"
            echo "to surface which queries, mutations, and mock responses need updates."
            echo
            echo "The complete \`schema.diff\`, \`schema-summary.md\`, and"
            echo "\`upstream-schema.graphql\` are attached to this workflow run as"
            echo "the \`unraid-schema-drift-${GITHUB_RUN_ID}\` artifact."
            echo
            echo "## Structured schema changes"
            echo
          } > issue-body.md
          exec 3>>issue-body.md

          max_body_bytes=60000
          append_with_budget() {
            file="$1"
            section_label="$2"
            reserve="$3"
            current_bytes="$(wc -c < issue-body.md)"
            remaining_bytes="$((max_body_bytes - current_bytes - reserve))"
            if [ "$remaining_bytes" -le 0 ]; then
              {
                echo
                echo "_${section_label} omitted to keep this issue body under ${max_body_bytes} bytes._"
                echo "_See the workflow artifact for the complete content._"
              } >&3
              return
            fi

            file_bytes="$(wc -c < "$file")"
            if [ "$file_bytes" -gt "$remaining_bytes" ]; then
              head -c "$remaining_bytes" "$file" >&3
              {
                echo
                echo
                echo "_${section_label} truncated to keep this issue body under ${max_body_bytes} bytes._"
                echo "_See the workflow artifact for the complete content._"
              } >&3
            else
              cat "$file" >&3
            fi
          }

          append_with_budget schema-summary.md "Structured schema summary" 14000

          {
            echo
            echo "## Suggested agent follow-up"
            echo
            echo "Ask an implementation agent to read this issue, update support for the"
            echo "new Unraid GraphQL API surface, run schema + dispatch contract tests,"
            echo "and open a PR with the required code/docs/test changes."
            echo
            echo "<details><summary>diff</summary>"
            echo
            echo "\`\`\`diff"
          } >&3

          append_with_budget schema.diff "Schema diff" 300

          {
            echo
            echo "\`\`\`"
            echo
            echo "</details>"
          } >&3
          exec 3>&-

          existing="$(
            gh issue list \
              --state open \
              --search "$title in:title" \
              --json number,title,body \
              --jq ".[] | select(.title == \"$title\") | select((.body // \"\") | contains(\"<!-- upstream-schema-sha256:\")) | .number" |
              head -n 1
          )"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue edit "$existing" --add-label "$label"
            issue_number="$existing"
          else
            issue_url="$(gh issue create --title "$title" --label "$label" --body-file issue-body.md)"
            issue_number="${issue_url##*/}"
          fi
          exec 4>>"$GITHUB_OUTPUT"
          echo "issue_number=${issue_number}" >&4
          echo "schema_hash=${schema_hash}" >&4
          echo "upstream_commit=${{ steps.upstream.outputs.commit }}" >&4
          exec 4>&-

      - name: Close resolved drift issue
        if: steps.diff.outputs.drift == 'false'
        run: |
          title="Unraid GraphQL schema drift detected"
          label="schema-drift"
          gh label create "$label" \
            --color "d73a4a" \
            --description "Automated upstream Unraid GraphQL schema drift reports" \
            >/dev/null 2>&1 || true

          existing="$(
            gh issue list \
              --state open \
              --json number,title,body \
              --jq ".[] | select(.title == \"$title\") | select((.body // \"\") | contains(\"<!-- upstream-schema-sha256:\")) | .number" |
              head -n 1
          )"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --add-label "$label"
            gh issue comment "$existing" \
              --body "The vendored Unraid SDL now matches \`unraid/api@main\`; closing this drift report."
            gh issue close "$existing" \
              --comment "Schema drift resolved by the current vendored SDL."
          fi

      # ---------------------------------------------------------------------
      # Rust SDL (unraid-rs/schema/unraid-schema.graphql), merged in from the
      # former rust-schema-drift.yml. It reads the SAME upstream blob fetched
      # above (../unraid-py/upstream-schema.graphql) instead of re-resolving and
      # re-downloading it on the same cron minute.
      # ---------------------------------------------------------------------
      - name: Strip vendored Rust provenance header
        if: ${{ !cancelled() }}
        working-directory: unraid-rs
        run: |
          # Guard: without the marker, `sed '1,/pat/d'` deletes to EOF → an empty
          # body that reads as a full-file drift (loud false positive). Fail instead.
          grep -q 'VENDOR-HEADER-END' schema/unraid-schema.graphql \
            || { echo "::error::VENDOR-HEADER-END marker missing in schema/unraid-schema.graphql"; exit 1; }
          sed '1,/VENDOR-HEADER-END/d' schema/unraid-schema.graphql > vendored-body.graphql

      - name: Diff vendored Rust schema
        id: rust_diff
        if: ${{ !cancelled() }}
        working-directory: unraid-rs
        run: |
          if diff -u vendored-body.graphql ../unraid-py/upstream-schema.graphql > schema.diff; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Vendored Rust Unraid SDL is up to date."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Unraid SDL has drifted from the vendored Rust copy:"
            cat schema.diff
          fi

      - name: Upload Rust schema drift artifacts
        if: ${{ !cancelled() && steps.rust_diff.outputs.drift == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: unraid-rs-schema-drift-${{ github.run_id }}
          path: |
            unraid-rs/schema.diff
            unraid-rs/vendored-body.graphql
          retention-days: 14

      - name: Open / update Rust drift issue
        if: ${{ !cancelled() && steps.rust_diff.outputs.drift == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('unraid-rs/schema.diff', 'utf8').slice(0, 60000);
            const title = 'Unraid GraphQL schema drift detected (unraid-rs)';
            const body = [
              'The vendored `unraid-rs/schema/unraid-schema.graphql` no longer matches',
              'Unraid\'s published SDL (`unraid/api@main`).',
              '',
              'Re-vendor it (copy the upstream file, re-add the provenance header),',
              'then let the cargo schema-contract test surface which queries/fixtures',
              'need updating.',
              '',
              '<details><summary>diff</summary>',
              '',
              '```diff',
              diff,
              '```',
              '',
              '</details>',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'schema-drift-rust',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['schema-drift-rust'],
              });
            }

      # Parity with the Python "Close resolved drift issue" step. Without this, a
      # drift issue opened here stayed open forever — even after the SDL was
      # re-vendored — leaving a permanently red signal nobody trusts.
      - name: Close resolved Rust drift issue
        if: ${{ !cancelled() && steps.rust_diff.outputs.drift == 'false' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'schema-drift-rust',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The vendored `unraid-rs/schema/unraid-schema.graphql` now matches `unraid/api@main`; closing this drift report.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
