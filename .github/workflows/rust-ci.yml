name: rust-ci

on:
  push:
    # main only — feature-branch pushes are covered by their PR run; without
    # this filter every PR branch push ran the workflow twice.
    branches: ["main"]
    paths: ["unraid-rs/**", ".github/workflows/rust-ci.yml"]
  pull_request:
    paths: ["unraid-rs/**", ".github/workflows/rust-ci.yml"]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# All run: steps execute inside the crate at unraid-rs/. Secret scanning is
# handled repo-wide by GitHub-native secret scanning + push protection (repo
# settings, unfiltered across every ref) — the gitleaks secret-scan.yml workflow
# was deleted in #266 as duplicate coverage; a tracked-.env guard is centralised too.
defaults:
  run:
    working-directory: unraid-rs

jobs:
  fmt:
    name: Formatting
    # SECURITY: self-hosted runs on the Unraid box. Never execute untrusted
    # fork-PR code here (build.rs/proc-macros/npm run arbitrary code). Runs on
    # push, dispatch, and same-repo (non-fork) PRs; fork PRs are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-rust
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the project MSRV (Cargo.toml rust-version) so CI enforces it.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    # SECURITY: self-hosted runs on the Unraid box. Never execute untrusted
    # fork-PR code here (build.rs/proc-macros/npm run arbitrary code). Runs on
    # push, dispatch, and same-repo (non-fork) PRs; fork PRs are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-rust
    timeout-minutes: 30
    # A CARGO_HOME override used to isolate this job from the runner's shared
    # Cargo GIT-checkout cache (a partially-pruned checkout could fail Clippy
    # before compiling). unraid-rs/Cargo.lock has zero git dependencies today,
    # and the override split the registry cache from the test job, doubling
    # downloads — so it was removed. Re-isolate (or use a rust-cache
    # prefix-key) only if a git dependency is ever reintroduced.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the project MSRV (Cargo.toml rust-version) so CI enforces it.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: unraid-rs

      - name: Clippy
        # --all-targets + test-support so the offline mock, example, and test
        # code (gated behind the feature) are linted too, not just the lib/bin.
        run: cargo clippy --all-targets --features test-support -- -D warnings

  test:
    name: Tests
    # SECURITY: self-hosted runs on the Unraid box. Never execute untrusted
    # fork-PR code here (build.rs/proc-macros/npm run arbitrary code). Runs on
    # push, dispatch, and same-repo (non-fork) PRs; fork PRs are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the project MSRV (Cargo.toml rust-version) so CI enforces it.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: unraid-rs

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed  # v2
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --profile ci

      # nextest doesn't build examples; build the standalone mock so its
      # breakage is caught in CI too.
      - name: Build example (mock server)
        run: cargo build --example mock_unraid --features test-support

  check-toml:
    name: TOML Format
    # SECURITY: self-hosted runs on the Unraid box. Never execute untrusted
    # fork-PR code here (build.rs/proc-macros/npm run arbitrary code). Runs on
    # push, dispatch, and same-repo (non-fork) PRs; fork PRs are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-ops
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install taplo
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed  # v2
        with:
          tool: taplo-cli

      - name: Check TOML formatting
        run: taplo check

  npm:
    name: npm launcher
    # SECURITY: self-hosted runs on the Unraid box. Never execute untrusted
    # fork-PR code here (build.rs/proc-macros/npm run arbitrary code). Runs on
    # push, dispatch, and same-repo (non-fork) PRs; fork PRs are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test npm launcher
        run: npm test --prefix packages/unraid-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/unraid-rmcp
      - name: Dry-run npm package
        run: npm pack --dry-run --json ./packages/unraid-rmcp
      # Covers every unraid-rs version carrier, including the agents/unraid-rs/
      # plugin manifests that live outside this crate. Nothing invoked this script
      # after the consolidation, which is how server.json drifted out of
      # release-please's reach unnoticed.
      - name: Version sync across all unraid-rs version carriers
        working-directory: ${{ github.workspace }}
        run: bash unraid-rs/scripts/check-version-sync.sh unraid-rs

  crates-package:
    name: Crates.io Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.90"
      - name: Package lab-auth exactly as crates.io will receive it
        run: cargo publish --package lab-auth --locked --dry-run
      - name: Validate unraid-rmcp payload before dependency publication
        run: |
          set -euo pipefail
          files="$(cargo package --package unraid-rmcp --locked --list)"
          if grep -Eq '^(packages/|docs/|config/|examples/|xtask/|target/)' <<<"$files"; then
            echo "unraid-rmcp package includes repository-only files" >&2
            exit 1
          fi
          grep -qx 'src/main.rs' <<<"$files"
          grep -qx 'schema/unraid-schema.graphql' <<<"$files"
          test "$(wc -l <<<"$files")" -lt 90

  docker-image:
    name: Container Image
    # The release image build is only exercised by rust-release.yml on a
    # published release, so a broken Dockerfile stayed invisible for three
    # consecutive releases (v0.3.0 through v0.4.0 all failed the docker job).
    # Building it here fails the PR instead of the release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plain `docker build` on the runner's preinstalled Docker: no new
      # third-party action, so nothing to add to .github/allowed-actions.txt.
      - name: Build the Rust server image
        working-directory: ${{ github.workspace }}
        run: docker build -f unraid-rs/config/Dockerfile -t unraid-rmcp:ci ./unraid-rs
      - name: The built binary must run
        working-directory: ${{ github.workspace }}
        run: docker run --rm --entrypoint /usr/local/bin/runraid unraid-rmcp:ci --version
