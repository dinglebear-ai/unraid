name: release-please

# Drives versioning + changelog from Conventional Commits.
#
# On every push to main, release-please maintains release PRs for the Python and
# Rust packages only. The bootstrap boundary in release-please-config.json excludes
# imported pre-monorepo history. Incus and Codex use the separate fixed-width
# plugin CalVer lane in .github/scripts/plugin_calver.py. Merging a package release
# PR creates its git tag and GitHub Release, triggering the matching publish jobs.
#
# IMPORTANT: `token` must be a PAT or GitHub App token with `contents: write` and
# `pull-requests: write`. The default GITHUB_TOKEN deliberately does NOT trigger
# downstream workflows, so tags/releases it creates would never reach publish-pypi
# or docker-publish. Store the token as the RELEASE_PLEASE_TOKEN secret.
#
# WARNING — silent failure mode: a classic PAT EXPIRES SILENTLY. When it lapses,
# this job simply stops opening/updating release PRs — no error, no alert — and
# releases quietly halt until someone notices. Prefer a GitHub App installation
# token (no expiry, scoped to exactly these permissions, and auditable per install)
# over a classic PAT. If you must use a PAT, set a calendar reminder tied to its
# expiry date so it gets rotated before it lapses.
#
# release-please bumps the Python version in pyproject.toml but NOT in uv.lock
# (which records the project's own version). Left unsynced, the release
# PR's `uv sync --locked` jobs (Test, Lint, Type Check, Security Audit) fail. The
# "Sync uv.lock" step below regenerates uv.lock on the release PR branch so those
# checks pass.

on:
  push:
    branches: ["main"]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When release PRs were opened/updated, sync generated artifacts on EVERY
      # release PR branch. release-please's `pr` output is only the FIRST PR; with
      # per-component release branches there are two (unraid-py + unraid-rs), so
      # iterate the `prs` array instead — anchoring on `pr` left the Rust release
      # PR without its lab-auth invariant fixup and meta-ci validate failed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          version: "0.9.25"
          enable-cache: false
      - name: Sync release PR branches (uv.lock + Rust invariants)
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in $(jq -r '.[].headBranchName' <<<"${RELEASE_PRS}"); do
            echo "::group::${branch}"
            git fetch origin "${branch}" "main"
            git switch -C release-pr-sync "origin/${branch}"

            # Python component: release-please bumps pyproject.toml but NOT
            # uv.lock (which records the project's own version). Left unsynced,
            # the release PR's `uv sync --locked` jobs fail.
            if ! git diff --quiet "origin/main...HEAD" -- unraid-py/pyproject.toml; then
              (cd unraid-py && uv lock)
              if ! git diff --quiet -- unraid-py/uv.lock; then
                git add unraid-py/uv.lock
                git commit -m "chore: sync uv.lock with release version bump"
              fi
            fi

            # Rust component: restore the frozen lab-auth 0.15.0 snapshot and
            # npm distribution metadata that release-please's Rust strategy
            # cannot preserve (meta-ci validate enforces these invariants).
            if ! git diff --quiet "origin/main...HEAD" -- unraid-rs/Cargo.toml; then
              python3 .github/scripts/release_pr_fixup.py
              files=(
                unraid-rs/Cargo.toml
                unraid-rs/Cargo.lock
                unraid-rs/crates/lab-auth/Cargo.toml
                unraid-rs/server.json
              )
              if ! git diff --quiet -- "${files[@]}"; then
                git add "${files[@]}"
                git commit -m "chore: sync Rust release invariants"
              fi
            fi

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${branch}")" ]; then
              git push "${push_url}" "HEAD:${branch}"
            else
              echo "${branch}: already in sync; nothing to push."
            fi
            echo "::endgroup::"
          done
