name: release-please

# Drives versioning + changelog from Conventional Commits.
#
# On every push to main, release-please maintains release PRs for the Python and
# Rust packages only. The bootstrap boundary in release-please-config.json excludes
# imported pre-monorepo history. Incus and Codex use the separate fixed-width
# plugin CalVer lane in .github/scripts/plugin_calver.py. Merging a package release
# PR creates its git tag and GitHub Release, triggering the matching publish jobs.
#
# IMPORTANT: `token` must be a PAT or GitHub App token with `contents: write` and
# `pull-requests: write`. The default GITHUB_TOKEN deliberately does NOT trigger
# downstream workflows, so tags/releases it creates would never reach publish-pypi
# or docker-publish. Store the token as the RELEASE_PLEASE_TOKEN secret.
#
# WARNING — silent failure mode: a classic PAT EXPIRES SILENTLY. When it lapses,
# this job simply stops opening/updating release PRs — no error, no alert — and
# releases quietly halt until someone notices. Prefer a GitHub App installation
# token (no expiry, scoped to exactly these permissions, and auditable per install)
# over a classic PAT. If you must use a PAT, set a calendar reminder tied to its
# expiry date so it gets rotated before it lapses.
#
# release-please bumps the Python version in pyproject.toml but NOT in uv.lock
# (which records the project's own version). Left unsynced, the release
# PR's `uv sync --locked` jobs (Test, Lint, Type Check, Security Audit) fail. The
# "Sync uv.lock" step below regenerates uv.lock on the release PR branch so those
# checks pass.

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release PR was opened/updated, sync uv.lock to the bumped version on
      # that branch. Runs only for release PRs (not when a release is tagged).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          version: "0.9.25"
          enable-cache: false
      - name: Sync uv.lock with the version bump
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        # uv.lock (and pyproject.toml) now live in unraid-py/.
        working-directory: unraid-py
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release version bump"
          git push "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${{ fromJson(steps.release.outputs.pr).headBranchName }}"
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
