name: incus-api-ci

on:
  push:
    branches: ["main"]
    paths:
      - "plugins/incus/unraid-api-plugin-incus/**"
      - "plugins/incus/packages/**"
      - "plugins/incus/incus.plg"
      - "plugins/incus/MANIFEST.md"
      - "plugins/incus/release-manifest.json"
      - ".github/workflows/incus-api-ci.yml"
  pull_request:
    paths:
      - "plugins/incus/unraid-api-plugin-incus/**"
      - "plugins/incus/packages/**"
      - "plugins/incus/incus.plg"
      - "plugins/incus/MANIFEST.md"
      - "plugins/incus/release-manifest.json"
      - ".github/workflows/incus-api-ci.yml"
  workflow_dispatch:

# This covers the NestJS/GraphQL backend and Vue frontend. Classic package
# verification is handled by incus-classic-ci.yml.

concurrency:
  group: incus-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unraid-api-plugin-incus) — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/incus/unraid-api-plugin-incus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Pin npm's resolver: npm 10 crashes while constructing this host-peer graph.
      - name: Use the validated npm resolver
        run: npm install --global npm@11.9.0

      # Runtime peers remain host-provided; pinned dev proxies and the shared
      # fixture make clean-checkout typechecking reproducible through the lock.
      - run: npm ci

      - name: Audit packaged backend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Enforce coverage floor
        run: npm run test:coverage

      - name: Build
        run: npx tsc

      - name: Verify coordinated classic payload matches this backend build
        run: |
          plugin_name="$(sed -n 's/.*<!ENTITY name[[:space:]]*"\([^"]*\)".*/\1/p' ../incus.plg)"
          txz="$(sed -n 's/.*<!ENTITY txz[[:space:]]*"\([^"]*\)".*/\1/p' ../incus.plg)"
          txz="${txz//&name;/$plugin_name}"
          archive="../packages/$txz"
          # The .txz plugin payload is a GitHub release asset (not tracked in git
          # after the monorepo consolidation). When it isn't present in-tree, skip
          # the payload diff; incus-release.yml fetches the prior asset and runs
          # the full determinism check at release time.
          if [ ! -f "$archive" ]; then
            echo "release asset $txz not present in-tree; skipping payload diff"
            exit 0
          fi
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xJf "$archive" -C "$stage" \
            usr/local/emhttp/plugins/incus/api-plugin
          payload="$stage/usr/local/emhttp/plugins/incus/api-plugin"
          diff -qr dist "$payload/dist"
          cmp package.json "$payload/package.json"
          cmp package-lock.json "$payload/package-lock.json"
          for dependency in ws graphql-subscriptions; do
            test -f "$payload/node_modules/$dependency/package.json"
          done

      - name: Upload dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unraid-api-plugin-incus-dist
          path: plugins/incus/unraid-api-plugin-incus/dist/
          # Build outputs re-derivable from any checkout, uploaded on every push
          # and PR; nothing downstream downloads them (grepped: no download-artifact
          # references these names). Short retention keeps them useful for triaging
          # a failed run without paying two weeks of storage per run.
          retention-days: 3

  frontend:
    name: Frontend (web/) — typecheck + build (settings + dashboard bundles)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/incus/unraid-api-plugin-incus/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/incus/unraid-api-plugin-incus/web/package-lock.json

      - name: Use the validated npm resolver
        run: npm install --global npm@11.9.0

      - run: npm ci

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Enforce coverage floor
        run: npm run test:coverage

      - name: Build (both bundles — npm run build chains build:settings + build:dashboard)
        run: npm run build

      - name: Verify deployed bundles match frontend source build
        run: |
          for asset in ../../unraid-api-plugin-incus/dist-web/*; do
            cmp "$asset" "../../source/usr/local/emhttp/plugins/incus/web/$(basename "$asset")"
          done
          cmp ../../unraid-api-plugin-incus/dist-web-dashboard/incus-dashboard.js \
            ../../source/usr/local/emhttp/plugins/incus/web/incus-dashboard.js

      - name: Upload incus-settings bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incus-settings-bundle
          path: plugins/incus/unraid-api-plugin-incus/dist-web/
          # Build outputs re-derivable from any checkout, uploaded on every push
          # and PR; nothing downstream downloads them (grepped: no download-artifact
          # references these names). Short retention keeps them useful for triaging
          # a failed run without paying two weeks of storage per run.
          retention-days: 3

      - name: Upload incus-dashboard bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incus-dashboard-bundle
          path: plugins/incus/unraid-api-plugin-incus/dist-web-dashboard/
          # Build outputs re-derivable from any checkout, uploaded on every push
          # and PR; nothing downstream downloads them (grepped: no download-artifact
          # references these names). Short retention keeps them useful for triaging
          # a failed run without paying two weeks of storage per run.
          retention-days: 3
