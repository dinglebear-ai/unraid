# Pin the crate's toolchain to its MSRV so local builds reproduce CI exactly.
# rust-ci.yml pins dtolnay/rust-toolchain to 1.90 (matching Cargo.toml's
# rust-version), and the root .mise.toml tracks `rust = "latest"` for the
# monorepo as a whole. Without this file, `cargo clippy -- -D warnings` locally
# runs on a newer stable carrying lints CI does not have, so a contributor can be
# red locally and green in CI (or the reverse). This file also governs
# contributors who do not use mise.
#
# Keep in sync with: unraid-rs/Cargo.toml `rust-version`
#                    .github/workflows/rust-ci.yml `toolchain:`
[toolchain]
channel = "1.90"
components = ["rustfmt", "clippy"]
