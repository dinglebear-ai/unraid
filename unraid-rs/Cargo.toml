[workspace]
# A root [package] is implicitly a workspace member; listing "." makes
# release-please resolve "unraid-rs/./Cargo.toml" and log a spurious
# "member . declared but did not find Cargo.toml" warning every run.
members = ["crates/lab-auth", "xtask"]
resolver = "2"

[workspace.package]
# Fleet edition (ADR-0002). Members inherit via edition.workspace = true.
edition = "2024"
# Fleet MSRV — the floor this repo supports. A separate promise from
# rust-toolchain.toml's channel, which is what we BUILD with. Both are
# 1.97.1 as of 2026-07-29 (ADR-0001 toolchain, ADR-0024 MSRV).
rust-version = "1.97.1"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
bare_urls = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
missing_safety_doc = "deny"

[package]
name = "unraid-rmcp"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "development-tools"]
keywords = ["mcp", "unraid", "graphql", "nas", "rmcp"]
repository = "https://github.com/dinglebear-ai/unraid"
homepage = "https://github.com/dinglebear-ai/unraid/tree/main/unraid-rs"
documentation = "https://docs.rs/unraid-rmcp"
readme = "README.md"
license = "MIT"
description = "Rust MCP server and CLI for Unraid GraphQL operations across NAS, Docker, VM, and storage workflows."
publish = ["crates-io"]
include = [
  "/src/**",
  "/schema/unraid-schema.graphql",
  "/tests/fixtures/scenarios/*.json",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]
autobins = false

[[bin]]
name = "runraid"
path = "src/main.rs"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/unraid-rs-v{ version }/runraid-x86_64.tar.gz"
pkg-fmt = "tgz"
bin-dir = "runraid-linux-x86_64"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
] }

# HTTP / MCP transport
axum = "0.8"
rmcp = { version = "=3.1.0", default-features = false, features = [
  "server",
  "macros",
  "elicitation",
  "schemars",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "1.1"

# OAuth + JWT
lab-auth = { version = "=0.15.0", path = "crates/lab-auth" }
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }

# GraphQL HTTP client
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# Typed GraphQL client (codegen from the vendored Unraid SDL). SPIKE: currently
# powers a couple of actions; being evaluated as the path to compile-time query +
# mutation/input type-checking across the whole API surface. We deliberately do
# NOT enable `http-reqwest` — that pulls reqwest 0.13 (we're on 0.12). cynic is
# used only to build typed operations + deserialize responses; transport stays on
# our existing reqwest client.
cynic = { version = "3" }

# Errors
anyhow = "1"
thiserror = "2"
dotenvy = "0.15.7"

# GraphQL query AST parsing — used only by the offline mock's query router
# (src/mock.rs) to classify a query by its real root field. Optional: pulled in
# only with the `test-support` feature, never in a release build.
graphql-parser = { version = "0.4", optional = true }

[build-dependencies]
# Registers the vendored Unraid SDL so cynic can type-check queries at compile time.
cynic-codegen = "3"

[features]
test-support = ["dep:graphql-parser"]

[dev-dependencies]
unraid-rmcp = { path = ".", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "=3.1.0", default-features = false, features = [
  "client",
  "transport-child-process",
] }
wiremock = "0.6"
# Schema-as-contract test (tests/schema_contract.rs): validates queries +
# fixtures against the vendored Unraid SDL.
apollo-compiler = "1"

[lints]
workspace = true
