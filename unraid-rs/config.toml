# unraid-rmcp configuration
# Secrets and URLs belong in .env — not here.
# All non-secret settings live here. Env vars override values below.

[unraid]
# TLS verification for the Unraid GraphQL endpoint.
# Override with UNRAID_API_SKIP_TLS_VERIFY=true in .env if the server
# uses a self-signed certificate.
skip_tls_verify = false
# For a private CA, prefer trusting its bundle over disabling verification:
# set UNRAID_API_CA_BUNDLE=/path/to/ca.pem (or ca_bundle here).
# ca_bundle = "/boot/config/ssl/certs/ca.pem"

[mcp]
host = "0.0.0.0"
port = 40010
server_name = "unraid-rmcp"
# no_auth = false  # set true only when fronted by a gateway that enforces auth
# allowed_hosts = ["unraid.example.com"]
# allowed_origins = ["https://unraid.example.com"]

[mcp.tools]
# Empty enabled means all actions. Disabled selectors always win.
# Selectors: "*", "unraid", "unraid.*", "docker_logs", "unraid.vm_reset".
# A set, non-empty UNRAID_RMCP_ENABLED_TOOLS / UNRAID_RMCP_DISABLED_TOOLS env
# var REPLACES the matching list below (no merge). Empty process placeholders
# may inherit a matching value from <UNRAID_HOME>/.env, ~/.unraid/.env, or
# /data/.env. MCP surface only; the CLI is not filtered by this policy.
# Unknown keys or misspelled tables fail startup instead of being ignored.
enabled = []
disabled = []

[mcp.auth]
mode = "bearer"
# public_url = "https://unraid.example.com"  # required when mode = "oauth"
admin_email = ""
allowed_emails = []
sqlite_path = "/data/auth.db"
key_path = "/data/auth-jwt.pem"
access_token_ttl_secs = 3600
refresh_token_ttl_secs = 2592000
auth_code_ttl_secs = 300
register_rpm = 10
authorize_rpm = 60
disable_static_token_with_oauth = true
allowed_client_redirect_uris = []
